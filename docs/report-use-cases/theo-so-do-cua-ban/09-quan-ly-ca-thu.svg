u</tspan></text><ellipse cx="975" cy="514" rx="150" ry="44" fill="#fff4cc" stroke="#c79818" stroke-width="1.45"/><text x="975" y="509.14" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="975" dy="0">Lập phiếu thu</tspan><tspan x="975" dy="21.96">cho lượt khám hoàn tất</tspan></text><ellipse cx="975" cy="646" rx="150" ry="44" fill="#fff4cc" stroke="#c79818" stroke-width="1.45"/><text x="975" y="641.14" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="975" dy="0">Ghi nhận thu tiền</tspan><tspan x="975" dy="21.96">mặt / chuyển khoản / POS</tspan></text><ellipse cx="975" cy="778" rx="150" ry="44" fill="#fff4cc" stroke="#c79818" stroke-width="1.45"/><text x="975" y="773.14" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="975" dy="0">Xem / in</tspan><tspan x="975" dy="21.96">biên nhận nội bộ</tspan></text><ellipse cx="975" cy="910" rx="150" ry="44" fill="#fff4cc" stroke="#c79818" stroke-width="1.45"/><text x="975" y="905.14" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="975" dy="0">Kiểm đếm, chốt</tspan><tspan x="975" dy="21.96">và gửi ca thu</tspan></text><ellipse cx="1355" cy="514" rx="125" ry="44" fill="#fff4cc" stroke="#c79818" stroke-width="1.45"/><text x="1355" y="509.14" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="1355" dy="0">Đối chiếu dịch vụ</tspan><tspan x="1355" dy="21.96">và giá đã chốt</tspan></text><rect x="1122" y="483" width="110" height="25" fill="white"/><text x="1177" y="500.26" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="1177" dy="0">«include»</tspan></text><text x="775" y="1037.76" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="775" dy="0">Nghiệp vụ thu phí được đặt cùng ca thu theo nhóm chức năng trong hình tổng quát.</tspan></text><text x="775" y="1062.76" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="775" dy="0">Thu tiền cần ca OPEN của người thu; ca đã chốt chờ Admin duyệt; không tự duyệt.</tspan></text><text x="775" y="1138.42" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="775" dy="0">Tam giác rỗng: chuyên biệt hóa mục tiêu | Nét đứt: include / extend có điều kiện</tspan></text></svg>