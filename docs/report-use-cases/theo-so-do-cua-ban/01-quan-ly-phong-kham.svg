" font-family="Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="975" dy="0">Cập nhật thông tin</tspan><tspan x="975" dy="21.96">giấy phép</tspan></text><ellipse cx="975" cy="778" rx="150" ry="44" fill="#fff4cc" stroke="#c79818" stroke-width="1.45"/><text x="975" y="784.12" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="975" dy="0">Gửi hồ sơ kiểm duyệt</tspan></text><rect x="670" y="221" width="153" height="25" fill="white"/><text x="746.5" y="238.26" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="746.5" dy="0">«include»</tspan></text><rect x="670" y="339" width="153" height="42" fill="white"/><text x="746.5" y="356.21999999999997" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="746.5" dy="0">«extend»</tspan><tspan x="746.5" dy="17.08">[Chọn cập nhật hồ sơ]</tspan></text><rect x="670" y="471" width="153" height="42" fill="white"/><text x="746.5" y="488.21999999999997" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="746.5" dy="0">«extend»</tspan><tspan x="746.5" dy="17.08">[Chọn quản lý chi nhánh]</tspan></text><rect x="670" y="603" width="153" height="42" fill="white"/><text x="746.5" y="620.22" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="746.5" dy="0">«extend»</tspan><tspan x="746.5" dy="17.08">[Chọn sửa giấy phép]</tspan></text><rect x="670" y="735" width="153" height="42" fill="white"/><text x="746.5" y="752.22" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="746.5" dy="0">«extend»</tspan><tspan x="746.5" dy="17.08">[Hồ sơ đủ điều kiện gửi]</tspan></text><text x="645" y="905.76" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="645" dy="0">Luồng cơ sở: xem hồ sơ; điểm mở rộng: chọn thao tác quản lý.</tspan></text><text x="645" y="930.76" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="645" dy="0">Phạm vi phòng khám / chi nhánh được kiểm tra trên máy chủ.</tspan></text><text x="645" y="1006.42" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="645" dy="0">Nét đứt: include (bắt buộc) / extend (bổ sung theo điều kiện)</tspan></text></svg>