c79818" stroke-width="1.35" marker-end="url(#generalization)"/><path d="M 825 778 L 735 778 L 556.8637612094267 566.692635699369" fill="none" stroke="#c79818" stroke-width="1.35" marker-end="url(#generalization)"/><g fill="none" stroke="#c79818" stroke-width="2"><circle cx="115" cy="468" r="14"/><path d="M 115 482 V 528 M 87 499 H 143 M 115 528 L 91 561 M 115 528 L 139 561"/></g><text x="115" y="598.12" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="115" dy="0">Bệnh nhân</tspan></text><ellipse cx="490" cy="514" rx="160" ry="58" fill="#fff4cc" stroke="#c79818" stroke-width="1.45"/><text x="490" y="483.42" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="490" dy="0">«abstract»</tspan></text><text x="490" y="527.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="normal" font-style="italic" fill="#17212f"><tspan x="490" dy="0">Tra cứu phòng khám, bác sĩ…</tspan></text><ellipse cx="975" cy="250" rx="150" ry="44" fill="#fff4cc" stroke="#c79818" stroke-width="1.45"/><text x="975" y="245.14000000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="975" dy="0">Xem thông tin</tspan><tspan x="975" dy="21.96">phòng khám / chi nhánh</tspan></text><ellipse cx="975" cy="382" rx="150" ry="44" fill="#fff4cc" stroke="#c79818" stroke-width="1.45"/><text x="975" y="377.14" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="975" dy="0">Tra cứu bác sĩ</tspan><tspan x="975" dy="21.96">và chuyên khoa</tspan></text><ellipse cx="975" cy="514" rx="150" ry="44" fill="#fff4cc" stroke="#c79818" stroke-width="1.45"/><text x="975" y="509.14" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="975" dy="0">Xem dịch vụ</tspan><tspan x="975" dy="21.96">và bảng giá</tspan></text><ellipse cx="975" cy="646" rx="150" ry="44" fill="#fff4cc" stroke="#c79818" stroke-width="1.45"/><text x="975" y="641.14" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="975" dy="0">Xem lịch làm việc</tspan><tspan x="975" dy="21.96">và khung giờ còn chỗ</tspan></text><ellipse cx="975" cy="778" rx="150" ry="44" fill="#fff4cc" stroke="#c79818" stroke-width="1.45"/><text x="975" y="773.14" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="975" dy="0">Xem thông tin</tspan><tspan x="975" dy="21.96">địa chỉ / liên hệ</tspan></text><text x="645" y="905.76" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="645" dy="0">Giữ actor Bệnh nhân như hình tổng quát; khách chưa có tài khoản cũng có thể tra cứu.</tspan></text><text x="645" y="930.76" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="645" dy="0">Tra cứu lịch trống không đồng nghĩa đã giữ chỗ hay tạo lịch hẹn.</tspan></text><text x="645" y="1006.42" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="645" dy="0">Tam giác rỗng: chuyên biệt hóa mục tiêu | Nét đứt: include / extend có điều kiện</tspan></text></svg>