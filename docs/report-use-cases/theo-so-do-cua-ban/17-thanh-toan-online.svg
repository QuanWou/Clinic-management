="#17212f"><tspan x="775" dy="0">payOS / VNPAY xác nhận qua máy chủ; VNPAY hiện dùng sandbox.</tspan></text><text x="775" y="798.76" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="775" dy="0">Chỉ thanh toán hóa đơn sau khám; không thu cọc. QR thủ công được tách ở phần xem lịch sử / chi phí.</tspan></text><text x="775" y="874.42" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="775" dy="0">Nét đứt: include (bắt buộc) / extend (bổ sung theo điều kiện)</tspan></text></svg>