"44" fill="#fff4cc" stroke="#c79818" stroke-width="1.45"/><text x="975" y="509.14" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="975" dy="0">Đối soát và duyệt</tspan><tspan x="975" dy="21.96">ca thu đã chốt</tspan></text><ellipse cx="975" cy="646" rx="150" ry="44" fill="#fff4cc" stroke="#c79818" stroke-width="1.45"/><text x="975" y="641.14" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="975" dy="0">Phê duyệt giảm trừ</tspan><tspan x="975" dy="21.96">hóa đơn</tspan></text><ellipse cx="975" cy="778" rx="150" ry="44" fill="#fff4cc" stroke="#c79818" stroke-width="1.45"/><text x="975" y="773.14" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="975" dy="0">Xem giao dịch cần</tspan><tspan x="975" dy="21.96">đối chiếu / đồng bộ phí</tspan></text><ellipse cx="975" cy="910" rx="150" ry="44" fill="#fff4cc" stroke="#c79818" stroke-width="1.45"/><text x="975" y="905.14" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="975" dy="0">Xem nhật ký hoạt động</tspan><tspan x="975" dy="21.96">và thay đổi phân quyền</tspan></text><text x="645" y="1037.76" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="645" dy="0">ADMIN quản trị tài chính; không mặc nhiên được thu tiền tại quầy.</tspan></text><text x="645" y="1062.76" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="645" dy="0">Người duyệt ca phải khác người thu. Biên nhận nội bộ không phải hóa đơn thuế.</tspan></text><text x="645" y="1138.42" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="645" dy="0">Tam giác rỗng: chuyên biệt hóa mục tiêu | Nét đứt: include / extend có điều kiện</tspan></text></svg>