n x="775" dy="0">Xác nhận không phải ký số; hoàn tất / đóng lượt khám độc lập với thanh toán.</tspan></text><text x="775" y="1006.42" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="775" dy="0">Tam giác rỗng: chuyên biệt hóa mục tiêu | Nét đứt: include / extend có điều kiện</tspan></text></svg>