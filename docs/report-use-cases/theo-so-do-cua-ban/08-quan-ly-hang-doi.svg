<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="1159" viewBox="0 0 1290 1159"><defs><marker id="open" markerWidth="13" markerHeight="13" refX="11" refY="6" orient="auto"><path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#c79818" stroke-width="1.4"/></marker><marker id="generalization" markerWidth="18" markerHeight="16" refX="15" refY="8" orient="auto"><path d="M 1 1 L 15 8 L 1 15 Z" fill="white" stroke="#c79818" stroke-width="1.3"/></marker></defs><rect width="1290" height="1159" fill="white"/><text x="645" y="46.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="bold" font-style="normal" fill="#17212f"><tspan x="645" dy="0">Hình 08 — Quản lý hàng đợi</tspan></text><rect x="245" y="83" width="995" height="49" rx="5" fill="#fafafa" stroke="#d5d9df"/><text x="742.5" y="113.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="742.5" dy="0">Tiền điều kiện: Đã đăng nhập; có quyền tiếp nhận; chọn chi nhánh / điểm phục vụ.</tspan></text><rect x="245" y="153" width="995" height="851" rx="3" fill="white" stroke="#9ca3af" stroke-width="1.3"/><text x="742.5" y="183.44" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#17212f"><tspan x="742.5" dy="0">HỆ THỐNG QUẢN LÝ PHÒNG KHÁM</tspan></text><path d="M 150 580 L 330 580" fill="none" stroke="#c79818" stroke-width="1.35"/><path d="M 545.2561843752486 525.5685347945312 L 735 250 L 825 250" fill="none" stroke="#c79818" stroke-width="1.35" stroke-dasharray="6 5" marker-end="url(#open)"/><path d="M 825 382 L 735 382 L 573.6513171975719 530.558325954868" fill="none" stroke="#c79818" stroke-width="1.35" stroke-dasharray="6 5" marker-end="url(#open)"/><path d="M 825 514 L 735 514 L 630.5792616243853 552.3037872620614" fill="none" stroke="#c79818" stroke-width="1.35" stroke-dasharray="6 5" marker-end="url(#open)"/><path d="M 825 646 L 735 646 L 63