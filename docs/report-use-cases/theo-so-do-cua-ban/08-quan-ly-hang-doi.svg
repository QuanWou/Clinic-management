s-serif" font-size="18" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="975" dy="0">Bỏ qua / ghi vắng</tspan><tspan x="975" dy="21.96">bệnh nhân</tspan></text><ellipse cx="975" cy="646" rx="150" ry="44" fill="#fff4cc" stroke="#c79818" stroke-width="1.45"/><text x="975" y="641.14" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="975" dy="0">Xếp lại bệnh nhân</tspan><tspan x="975" dy="21.96">vào hàng đợi</tspan></text><ellipse cx="975" cy="778" rx="150" ry="44" fill="#fff4cc" stroke="#c79818" stroke-width="1.45"/><text x="975" y="784.12" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="975" dy="0">Chuyển điểm phục vụ</tspan></text><ellipse cx="975" cy="910" rx="150" ry="44" fill="#fff4cc" stroke="#c79818" stroke-width="1.45"/><text x="975" y="905.14" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="975" dy="0">Chuyển tiếp vé</tspan><tspan x="975" dy="21.96">sang ngày mới</tspan></text><rect x="670" y="221" width="153" height="25" fill="white"/><text x="746.5" y="238.26" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="746.5" dy="0">«include»</tspan></text><rect x="670" y="339" width="153" height="51" fill="white"/><text x="746.5" y="352.18" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="746.5" dy="0">«extend»</tspan><tspan x="746.5" dy="17.08">[Chọn gọi vé đủ điều</tspan><tspan x="746.5" dy="17.08">kiện]</tspan></text><rect x="670" y="471" width="153" height="51" fill="white"/><text x="746.5" y="484.18" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="746.5" dy="0">«extend»</tspan><tspan x="746.5" dy="17.08">[Vé có thể bỏ qua / ghi</tspan><tspan x="746.5" dy="17.08">vắng]</tspan></text><rect x="670" y="603" width="153" height="51" fill="white"/><text x="746.5" y="616.18" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="746.5" dy="0">«extend»</tspan><tspan x="746.5" dy="17.08">[Vé đủ điều kiện xếp</tspan><tspan x="746.5" dy="17.08">lại]</tspan></text><rect x="670" y="735" width="153" height="42" fill="white"/><text x="746.5" y="752.22" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="746.5" dy="0">«extend»</tspan><tspan x="746.5" dy="17.08">[Chọn điểm đích hợp lệ]</tspan></text><rect x="670" y="867" width="153" height="51" fill="white"/><text x="746.5" y="880.18" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="746.5" dy="0">«extend»</tspan><tspan x="746.5" dy="17.08">[Vé đủ điều kiện chuyển</tspan><tspan x="746.5" dy="17.08">tiếp]</tspan></text><text x="645" y="1037.76" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="645" dy="0">Luồng cơ sở: xem hàng đợi; điểm mở rộng: chọn thao tác trên vé.</tspan></text><text x="645" y="1062.76" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="645" dy="0">Mỗi thao tác chỉ được thực hiện ở trạng thái vé và phạm vi được phép.</tspan></text><text x="645" y="1138.42" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="645" dy="0">Nét đứt: include (bắt buộc) / extend (bổ sung theo điều kiện)</tspan></text></svg>