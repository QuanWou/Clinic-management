ont-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="746.5" dy="0">«include»</tspan></text><rect x="670" y="485" width="153" height="25" fill="white"/><text x="746.5" y="502.26" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="746.5" dy="0">«include»</tspan></text><text x="645" y="653.76" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="645" dy="0">Dữ liệu đăng ký: họ tên, email, mật khẩu; mật khẩu từ 8 đến 100 ký tự.</tspan></text><text x="645" y="678.76" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="645" dy="0">Hệ thống lưu mật khẩu dạng băm. Không có căn cứ cho OTP / xác thực email trong luồng này.</tspan></text><text x="645" y="754.42" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="645" dy="0">Nét đứt: include (bắt buộc) / extend (bổ sung theo điều kiện)</tspan></text></svg>