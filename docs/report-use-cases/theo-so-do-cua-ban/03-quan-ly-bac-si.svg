><tspan x="975" dy="0">Cập nhật chuyên khoa</tspan><tspan x="975" dy="21.96">và thông tin công khai</tspan></text><ellipse cx="975" cy="646" rx="150" ry="44" fill="#fff4cc" stroke="#c79818" stroke-width="1.45"/><text x="975" y="641.14" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="975" dy="0">Thêm / sửa</tspan><tspan x="975" dy="21.96">lịch làm việc</tspan></text><ellipse cx="975" cy="778" rx="150" ry="44" fill="#fff4cc" stroke="#c79818" stroke-width="1.45"/><text x="975" y="773.14" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="975" dy="0">Ghi nhận khoảng vắng</tspan><tspan x="975" dy="21.96">của bác sĩ</tspan></text><ellipse cx="975" cy="910" rx="150" ry="44" fill="#fff4cc" stroke="#c79818" stroke-width="1.45"/><text x="975" y="905.14" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="975" dy="0">Sửa / hủy</tspan><tspan x="975" dy="21.96">khoảng vắng</tspan></text><rect x="670" y="221" width="153" height="25" fill="white"/><text x="746.5" y="238.26" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="746.5" dy="0">«include»</tspan></text><rect x="670" y="339" width="153" height="42" fill="white"/><text x="746.5" y="356.21999999999997" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="746.5" dy="0">«extend»</tspan><tspan x="746.5" dy="17.08">[Chọn quản lý bác sĩ]</tspan></text><rect x="670" y="471" width="153" height="42" fill="white"/><text x="746.5" y="488.21999999999997" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="746.5" dy="0">«extend»</tspan><tspan x="746.5" dy="17.08">[Chọn sửa thông tin]</tspan></text><rect x="670" y="603" width="153" height="42" fill="white"/><text x="746.5" y="620.22" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="746.5" dy="0">«extend»</tspan><tspan x="746.5" dy="17.08">[Chọn quản lý lịch]</tspan></text><rect x="670" y="735" width="153" height="42" fill="white"/><text x="746.5" y="752.22" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="746.5" dy="0">«extend»</tspan><tspan x="746.5" dy="17.08">[Bác sĩ có lịch vắng]</tspan></text><rect x="670" y="867" width="153" height="42" fill="white"/><text x="746.5" y="884.22" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="746.5" dy="0">«extend»</tspan><tspan x="746.5" dy="17.08">[Khoảng vắng được chọn]</tspan></text><text x="645" y="1037.76" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="645" dy="0">Luồng cơ sở: xem danh sách; điểm mở rộng: chọn thao tác bác sĩ.</tspan></text><text x="645" y="1062.76" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="645" dy="0">Khoảng vắng và lịch làm việc ảnh hưởng khả năng đặt lịch.</tspan></text><text x="645" y="1138.42" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="645" dy="0">Nét đứt: include (bắt buộc) / extend (bổ sung theo điều kiện)</tspan></text></svg>