idth="1.45"/><text x="975" y="447.14" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="975" dy="0">Xem lịch hẹn</tspan><tspan x="975" dy="21.96">của tôi</tspan></text><ellipse cx="975" cy="584" rx="150" ry="44" fill="#fff4cc" stroke="#c79818" stroke-width="1.45"/><text x="975" y="590.12" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="975" dy="0">Đổi lịch hẹn</tspan></text><ellipse cx="975" cy="716" rx="150" ry="44" fill="#fff4cc" stroke="#c79818" stroke-width="1.45"/><text x="975" y="722.12" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="975" dy="0">Hủy lịch hẹn</tspan></text><ellipse cx="975" cy="848" rx="150" ry="44" fill="#fff4cc" stroke="#c79818" stroke-width="1.45"/><text x="975" y="854.12" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="975" dy="0">Đặt lịch tái khám</tspan></text><ellipse cx="1355" cy="266" rx="125" ry="44" fill="#fff4cc" stroke="#c79818" stroke-width="1.45"/><text x="1355" y="261.14" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="1355" dy="0">Giữ chỗ</tspan><tspan x="1355" dy="21.96">khung giờ</tspan></text><ellipse cx="1355" cy="374" rx="125" ry="44" fill="#fff4cc" stroke="#c79818" stroke-width="1.45"/><text x="1355" y="369.14" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="1355" dy="0">Xác nhận</tspan><tspan x="1355" dy="21.96">lịch hẹn</tspan></text><ellipse cx="1355" cy="584" rx="125" ry="44" fill="#fff4cc" stroke="#c79818" stroke-width="1.45"/><text x="1355" y="579.14" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="1355" dy="0">Giữ chỗ</tspan><tspan x="1355" dy="21.96">khung giờ mới</tspan></text><ellipse cx="1355" cy="848" rx="125" ry="44" fill="#fff4cc" stroke="#c79818" stroke-width="1.45"/><text x="1355" y="843.14" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="1355" dy="0">Giữ chỗ và</tspan><tspan x="1355" dy="21.96">xác nhận lịch tái khám</tspan></text><rect x="1122" y="289" width="110" height="25" fill="white"/><text x="1177" y="306.26" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="1177" dy="0">«include»</tspan></text><rect x="1122" y="289" width="110" height="25" fill="white"/><text x="1177" y="306.26" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="1177" dy="0">«include»</tspan></text><rect x="1122" y="553" width="110" height="25" fill="white"/><text x="1177" y="570.26" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="1177" dy="0">«include»</tspan></text><rect x="1122" y="817" width="110" height="25" fill="white"/><text x="1177" y="834.26" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="1177" dy="0">«include»</tspan></text><text x="775" y="975.76" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="775" dy="0">Đặt / đổi / hủy là các mục tiêu chuyên biệt của quản lý lịch; không mở rộng lẫn nhau.</tspan></text><text x="775" y="1000.76" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="775" dy="0">Khung giờ và lịch hẹn phải đủ điều kiện; đặt lịch không thu cọc.</tspan></text><text x="775" y="1076.42" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#17212f"><tspan x="775" dy="0">Tam giác rỗng: chuyên biệt hóa mục tiêu | Nét đứt: include / extend có điều kiện</tspan></text></svg>