version: 0.9.0
producerValidation: workload credential + event schema + aggregate ownership; consumers
  reestablish tenant scope
events:
- type: clinic.clinic.published.v1
  owner: Clinic
  payloadRequired:
  - clinicId
  - publicationVersion
  consumers:
  - Search
  - Appointment
- type: clinic.clinic.suspended.v1
  owner: Clinic
  payloadRequired:
  - clinicId
  - reasonCode
  consumers:
  - Search
  - Appointment
  - Notification
- type: clinic.doctor.schedule_changed.v1
  owner: Doctor
  payloadRequired:
  - doctorId
  - clinicId
  - branchId
  - scheduleVersion
  consumers:
  - Appointment
  - Search
- type: clinic.catalog.price_published.v1
  owner: Catalog
  payloadRequired:
  - offeringId
  - branchId
  - priceVersionId
  - amountVnd
  consumers:
  - Appointment
  - Search
- type: clinic.appointment.confirmed.v1
  owner: Appointment
  payloadRequired:
  - appointmentId
  - clinicId
  - branchId
  - patientRef
  - slotId
  consumers:
  - Encounter
  - Notification
  - Search
- type: clinic.appointment.cancelled.v1
  owner: Appointment
  payloadRequired:
  - appointmentId
  - reasonCode
  consumers:
  - Billing
  - Notification
  - Search
- type: clinic.encounter.checked_in.v1
  owner: Encounter
  payloadRequired:
  - visitId
  - appointmentId
  - branchId
  consumers:
  - Medical
  - Notification
- type: clinic.medical.order_placed.v1
  owner: Medical
  payloadRequired:
  - orderId
  - visitId
  - offeringId
  - priceVersionId
  consumers:
  - Billing
- type: clinic.medical.result_released.v1
  owner: Medical
  payloadRequired:
  - orderId
  - resultId
  - visitId
  consumers:
  - MedicalWorklist
- type: clinic.medical.document_released.v1
  owner: Medical
  payloadRequired:
  - documentId
  - versionId
  - visitId
  consumers:
  - Portal
  - Notification
- type: clinic.billing.payment_succeeded.v1
  owner: Billing
  payloadRequired:
  - paymentId
  - intentId
  - billId
  - amountVnd
  consumers:
  - Appointment
  - Portal
- type: clinic.billing.refund_succeeded.v1
  owner: Billing
  payloadRequired:
  - refundId
  - originalPaymentId
  - amountVnd
  consumers:
  - Appointment
  - Portal
- type: clinic.identity.membership_revoked.v1
  owner: Identity
  payloadRequired:
  - membershipId
  - userId
  - clinicId
  - membershipVersion
  consumers:
  - AuthCache
