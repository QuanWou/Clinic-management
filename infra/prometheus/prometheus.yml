global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]

  - job_name: identity-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["identity-service:8083"]

  - job_name: patient-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["patient-service:8084"]

  - job_name: doctor-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["doctor-service:8085"]

  - job_name: appointment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["appointment-service:8086"]

  - job_name: medical-record-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["medical-record-service:8087"]

  - job_name: billing-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["billing-service:8088"]

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:8089"]
