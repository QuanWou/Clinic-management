server:
  port: 8084

spring:
  application:
    name: patient-service
  datasource:
    url: jdbc:postgresql://localhost:5432/clinic_db?currentSchema=patient
    username: postgres
    password: password # Replace in prod
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: patient
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: patient

app:
  internal:
    service-key: ${APP_INTERNAL_SERVICE_KEY:local-dev-internal-service-key}
  security:
    jwt:
      secret: 0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF
      access-token-expiration-minutes: 60
      refresh-token-expiration-days: 7

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
