server:
  port: 8089

spring:
  application:
    name: notification-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clinic_db?currentSchema=notification}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: notification
  flyway:
    enabled: true
    schemas: notification
    locations: classpath:db/migration
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:false}

app:
  security:
    jwt:
      secret: ${APP_SECURITY_JWT_SECRET}
      access-token-expiration-minutes: 60
      refresh-token-expiration-days: 7
  notification:
    dispatch-interval-ms: ${APP_NOTIFICATION_DISPATCH_INTERVAL_MS:10000}
    email:
      enabled: ${APP_NOTIFICATION_EMAIL_ENABLED:false}
      from: ${APP_NOTIFICATION_EMAIL_FROM:}
    rabbitmq:
      exchange: ${APP_NOTIFICATION_RABBITMQ_EXCHANGE:notification.exchange}
      queue: ${APP_NOTIFICATION_RABBITMQ_QUEUE:notification.delivery.v2.queue}
      routing-key: ${APP_NOTIFICATION_RABBITMQ_ROUTING_KEY:notification.delivery.v2}
      event-queue: ${APP_NOTIFICATION_RABBITMQ_EVENT_QUEUE:notification.events.v2.queue}
      event-routing-key: ${APP_NOTIFICATION_RABBITMQ_EVENT_ROUTING_KEY:notification.business}
    sms:
      enabled: ${APP_NOTIFICATION_SMS_ENABLED:false}
      endpoint: ${APP_NOTIFICATION_SMS_ENDPOINT:}
      api-key: ${APP_NOTIFICATION_SMS_API_KEY:}
      sender: ${APP_NOTIFICATION_SMS_SENDER:Clinic}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
