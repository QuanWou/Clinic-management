server:
  port: ${BILLING_PORT:8103}
spring:
  jackson:
    deserialization:
      accept-float-as-int: false
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: billing-service
  datasource:
    url: ${BILLING_DB_URL}
    username: ${BILLING_DB_USER}
    password: ${BILLING_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: billing_v2
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    default-schema: billing_v2
    schemas: billing_v2
    locations: classpath:/modules/billing/db/migration
    user: ${BILLING_MIGRATION_DB_USER:${BILLING_DB_USER}}
    password: ${BILLING_MIGRATION_DB_PASSWORD:${BILLING_DB_PASSWORD}}
management:
  endpoints:
    web:
      exposure:
        include: health,info
billing:
  payments:
    enabled: ${CLINIC_PAYMENTS_ENABLED:false}
    clinic-id: ${CLINIC_PAYMENTS_CLINIC_ID:00000000-0000-0000-0000-000000000000}
    public-url: ${CLINIC_PAYMENTS_PUBLIC_URL:http://127.0.0.1:4176}
    payos:
      client-id: ${PAYOS_CLIENT_ID:}
      api-key: ${PAYOS_API_KEY:}
      checksum-key: ${PAYOS_CHECKSUM_KEY:}
      base-url: ${PAYOS_BASE_URL:https://api-merchant.payos.vn}
    vnpay:
      tmn-code: ${VNPAY_TMN_CODE:}
      hash-secret: ${VNPAY_HASH_SECRET:}
      url: ${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    bank:
      bank-code: ${BANK_TRANSFER_BANK_CODE:}
      bank-name: ${BANK_TRANSFER_BANK_NAME:}
      account-number: ${BANK_TRANSFER_ACCOUNT_NUMBER:}
      account-name: ${BANK_TRANSFER_ACCOUNT_NAME:}
  security:
    service-secret: ${BILLING_SERVICE_SECRET}
    iam-url: ${BILLING_IAM_URL:http://localhost:8093}
    iam-service-secret: ${BILLING_IAM_SERVICE_SECRET}
    clinic-url: ${BILLING_CLINIC_URL:http://localhost:8092}
    clinic-service-secret: ${BILLING_CLINIC_SERVICE_SECRET}


  sources:
    patient-url: ${BILLING_PATIENT_URL:http://127.0.0.1:8098}
    encounter-url: ${BILLING_ENCOUNTER_URL:http://127.0.0.1:8101}
    medical-url: ${BILLING_MEDICAL_URL:http://127.0.0.1:8102}
    appointment-url: ${BILLING_APPOINTMENT_URL:http://127.0.0.1:8099}
  notification:
    enabled: ${BILLING_NOTIFICATION_ENABLED:false}
    patient-url: ${BILLING_NOTIFICATION_PATIENT_URL:http://127.0.0.1:8098}
    notification-url: ${BILLING_NOTIFICATION_NOTIFICATION_URL:http://127.0.0.1:8100}
    delay-ms: ${BILLING_NOTIFICATION_DELAY_MS:1000}
  charges:
    enabled: ${BILLING_CHARGES_ENABLED:false}
    medical-secret: ${BILLING_CHARGES_MEDICAL_SECRET:}
    encounter-secret: ${BILLING_CHARGES_ENCOUNTER_SECRET:}
    delay-ms: ${BILLING_CHARGES_DELAY_MS:1000}
