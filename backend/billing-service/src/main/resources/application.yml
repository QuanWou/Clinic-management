server:
  port: 8088

spring:
  application:
    name: billing-service
  datasource:
    url: jdbc:postgresql://localhost:5432/clinic_db?currentSchema=billing
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: billing
  flyway:
    enabled: true
    schemas: billing
    locations: classpath:db/migration
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true

services:
  appointment:
    url: http://localhost:8086
  patient:
    url: http://localhost:8084
  catalog:
    # Task 02 catalog API: /api/catalog/services/{id}/price?on=YYYY-MM-DD
    url: ${CATALOG_SERVICE_URL:http://localhost:8091}
  medical:
    # Task 04 billable-items endpoint; must be deployed before invoicing.
    url: ${MEDICAL_SERVICE_URL:http://localhost:8087}

app:
  internal:
    service-key: ${APP_INTERNAL_SERVICE_KEY:local-dev-internal-service-key}
  notification:
    relay-interval-ms: ${APP_NOTIFICATION_RELAY_INTERVAL_MS:10000}
    rabbitmq:
      exchange: ${APP_NOTIFICATION_RABBITMQ_EXCHANGE:notification.exchange}
      event-routing-key: ${APP_NOTIFICATION_RABBITMQ_EVENT_ROUTING_KEY:notification.business}
  security:
    jwt:
      secret: 0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF
      access-token-expiration-minutes: 60
      refresh-token-expiration-days: 7

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
