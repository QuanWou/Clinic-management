server:
  port: ${DOCTOR_PORT:8094}
spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: doctor-service
  datasource:
    url: ${DOCTOR_DB_URL}
    username: ${DOCTOR_DB_USER}
    password: ${DOCTOR_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: doctor
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    default-schema: doctor
    schemas: doctor
    locations: classpath:/modules/doctor/db/migration
    user: ${DOCTOR_MIGRATION_DB_USER:${DOCTOR_DB_USER}}
    password: ${DOCTOR_MIGRATION_DB_PASSWORD:${DOCTOR_DB_PASSWORD}}
management:
  endpoints:
    web:
      exposure:
        include: health,info
doctor:
  security:
    iam-url: ${DOCTOR_IAM_URL:http://localhost:8093}
    iam-service-secret: ${DOCTOR_IAM_SERVICE_SECRET}
    clinic-url: ${DOCTOR_CLINIC_URL:http://localhost:8092}
    clinic-service-secret: ${DOCTOR_CLINIC_SERVICE_SECRET}
