server:
  port: 8087

spring:
  application:
    name: medical-record-service
  datasource:
    url: jdbc:postgresql://localhost:5432/clinic_db?currentSchema=medical_record
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: medical_record
  flyway:
    enabled: true
    schemas: medical_record
    locations: classpath:db/migration
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true

services:
  appointment:
    url: http://localhost:8086
  doctor:
    url: http://localhost:8085
  patient:
    url: http://localhost:8084
  catalog:
    url: ${CATALOG_SERVICE_URL:http://localhost:8091}

app:
  internal:
    service-key: ${APP_INTERNAL_SERVICE_KEY:local-dev-internal-service-key}
  notification:
    relay-interval-ms: ${APP_NOTIFICATION_RELAY_INTERVAL_MS:10000}
    rabbitmq:
      exchange: ${APP_NOTIFICATION_RABBITMQ_EXCHANGE:notification.exchange}
      event-routing-key: ${APP_NOTIFICATION_RABBITMQ_EVENT_ROUTING_KEY:notification.business}
  security:
    jwt:
      secret: 0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF
      access-token-expiration-minutes: 60
      refresh-token-expiration-days: 7

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
