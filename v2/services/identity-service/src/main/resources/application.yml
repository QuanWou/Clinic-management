server:
  port: ${IAM_V2_PORT:8093}
spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: identity-v2-service
  datasource:
    url: ${IAM_V2_DB_URL}
    username: ${IAM_V2_DB_USER}
    password: ${IAM_V2_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: iam
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    default-schema: iam
    schemas: iam
    locations: classpath:db/migration
    user: ${IAM_V2_DB_MIGRATOR_USER:${IAM_V2_DB_USER}}
    password: ${IAM_V2_DB_MIGRATOR_PASSWORD:${IAM_V2_DB_PASSWORD}}
management:
  endpoints:
    web:
      exposure:
        include: health,info
iam:
  security:
    jwt-secret: ${IAM_V2_JWT_SECRET}
    legacy-identity-url: ${IAM_V2_LEGACY_IDENTITY_URL:http://localhost:8083}
    workload-inbound-secret: ${IAM_V2_WORKLOAD_INBOUND_SECRET:${IAM_V2_CLINIC_INBOUND_SECRET:}}
    workload-audience: identity-v2-service
    allowed-workload-issuers: ${IAM_V2_ALLOWED_WORKLOAD_ISSUERS:clinic-v2-service,doctor-v2-service,catalog-v2-service,patient-v2-service,encounter-v2-service,medical-v2-service,billing-v2-service,appointment-v2-service}
  clinic:
    url: ${IAM_V2_CLINIC_URL:http://localhost:8092}
    workload-issuer: identity-v2-service
    workload-audience: clinic-v2-service
    workload-outbound-secret: ${IAM_V2_CLINIC_OUTBOUND_SECRET}
