server:
  port: ${ENCOUNTER_V2_PORT:8101}
spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: encounter-v2-service
  datasource:
    url: ${ENCOUNTER_V2_DB_URL}
    username: ${ENCOUNTER_V2_DB_USER}
    password: ${ENCOUNTER_V2_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: encounter_v2
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    default-schema: encounter_v2
    schemas: encounter_v2
    locations: classpath:db/migration
    user: ${ENCOUNTER_V2_MIGRATION_DB_USER:${ENCOUNTER_V2_DB_USER}}
    password: ${ENCOUNTER_V2_MIGRATION_DB_PASSWORD:${ENCOUNTER_V2_DB_PASSWORD}}
management:
  endpoints:
    web:
      exposure:
        include: health,info
encounter:
  charges:
    enabled: ${ENCOUNTER_CHARGES_ENABLED:false}
    billing-url: ${ENCOUNTER_CHARGES_BILLING_URL:http://127.0.0.1:8103}
    delay-ms: ${ENCOUNTER_CHARGES_DELAY_MS:1000}
  portal:
    patient-url: ${ENCOUNTER_PORTAL_PATIENT_URL:http://127.0.0.1:8098}
  security:
    service-secret: ${ENCOUNTER_V2_SERVICE_SECRET}
    iam-url: ${ENCOUNTER_V2_IAM_URL:http://localhost:8093}
    iam-service-secret: ${ENCOUNTER_V2_IAM_SERVICE_SECRET}
    clinic-url: ${ENCOUNTER_V2_CLINIC_URL:http://localhost:8092}
    clinic-service-secret: ${ENCOUNTER_V2_CLINIC_SERVICE_SECRET}

