server:
  port: ${AUDIT_V2_PORT:8096}
spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: audit-v2-service
  datasource:
    url: ${AUDIT_V2_DB_URL}
    username: ${AUDIT_V2_DB_USER}
    password: ${AUDIT_V2_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: audit_v2
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    default-schema: audit_v2
    schemas: audit_v2
    locations: classpath:db/migration
    user: ${AUDIT_V2_MIGRATION_DB_USER:${AUDIT_V2_DB_USER}}
    password: ${AUDIT_V2_MIGRATION_DB_PASSWORD:${AUDIT_V2_DB_PASSWORD}}
management:
  endpoints:
    web:
      exposure:
        include: health,info
audit:
  security:
    identity-secret: ${AUDIT_V2_IDENTITY_SECRET:}
    clinic-secret: ${AUDIT_V2_CLINIC_SECRET:}
    doctor-secret: ${AUDIT_V2_DOCTOR_SECRET:}
    catalog-secret: ${AUDIT_V2_CATALOG_SECRET:}
    audience: audit-v2-service
  outbox:
    max-attempts: ${AUDIT_V2_OUTBOX_MAX_ATTEMPTS:5}
