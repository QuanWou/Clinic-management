server:
  port: ${SEARCH_V2_PORT:8097}
spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: search-v2-service
  datasource:
    url: ${SEARCH_V2_DB_URL}
    username: ${SEARCH_V2_DB_USER}
    password: ${SEARCH_V2_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: search_v2
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    default-schema: search_v2
    schemas: search_v2
    user: ${SEARCH_V2_MIGRATION_DB_USER:${SEARCH_V2_DB_USER}}
    password: ${SEARCH_V2_MIGRATION_DB_PASSWORD:${SEARCH_V2_DB_PASSWORD}}
search:
  security:
    clinic-secret: ${SEARCH_V2_CLINIC_SECRET:}
    doctor-secret: ${SEARCH_V2_DOCTOR_SECRET:}
    catalog-secret: ${SEARCH_V2_CATALOG_SECRET:}
    audience: search-v2-service
