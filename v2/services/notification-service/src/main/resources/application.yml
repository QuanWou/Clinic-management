server:
  port: ${NOTIFICATION_V2_PORT:8100}
spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${NOTIFICATION_V2_DB_URL}
    username: ${NOTIFICATION_V2_DB_USER}
    password: ${NOTIFICATION_V2_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: notification_v2
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    default-schema: notification_v2
    schemas: notification_v2
    user: ${NOTIFICATION_V2_MIGRATION_DB_USER:${NOTIFICATION_V2_DB_USER}}
    password: ${NOTIFICATION_V2_MIGRATION_DB_PASSWORD:${NOTIFICATION_V2_DB_PASSWORD}}
notification:
  security:
    identity-url: ${NOTIFICATION_V2_IDENTITY_URL:http://127.0.0.1:8093}
    appointment-secret: ${NOTIFICATION_V2_APPOINTMENT_SECRET:}
    billing-secret: ${NOTIFICATION_V2_BILLING_SECRET:}
    audience: notification-v2-service

